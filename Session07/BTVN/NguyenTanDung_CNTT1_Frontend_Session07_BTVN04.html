<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            background-color: bisque;
            justify-content: center;
            align-items: center;
            display: flex;
        }

        .box {
            width: 250px;
            padding: 15px;
            margin: 10px;
            border: 1px solid #ccc;
            display: inline-block;
            text-align: center;
            background-color: azure;
        }

        .box h2 {
            color: aqua;
        }

        .box p {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>Niềng răng</h2>
            <p>Điều chỉnh răng lệch lạc, mang lại hàm răng đều đẹp và nụ cười tự tin</p>
        </div>
        <div class="box">
            <h2>Cấy ghép Implant</h2>
            <p>Giải pháp phục hình răng mất với công nghệ hiện đại, an toàn và bền lâu</p>
        </div>
        <div class="box">
            <h2>Khám răng định kỳ</h2>
            <p>Kiểm tra và chăm sóc răng miệng thường xuyên để phòng ngừa các bệnh lý</p>
        </div>
    </div>
</body>
</html>
