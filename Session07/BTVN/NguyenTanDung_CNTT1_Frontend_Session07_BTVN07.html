<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Mẫu Feedback Nha Khoa</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .feedback-form {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border: 1px solid #333;
            box-sizing: border-box;
        }

        h2 {
            color: #00665c;
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        label {
            display: block;
            color: #004d40;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
            color: #333;
        }

        ::placeholder {
            color: #999;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            background-color: #12a19a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0e857f;
        }
    </style>
</head>

<body>

    <div class="feedback-form">
        <h2>Biểu Mẫu Feedback Phòng Khám Nha Khoa</h2>

        <form>
            <label for="fullname">Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nhập họ tên">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@gmail.com">

            <label for="service">Dịch vụ đã sử dụng</label>
            <select id="service">
                <option value="tong-quat">Khám răng tổng quát</option>
                <option value="nieng-rang">Niềng răng</option>
                <option value="tay-trang">Tẩy trắng răng</option>
                <option value="nho-rang">Nhổ răng khôn</option>
            </select>

            <label for="satisfaction">Mức độ hài lòng</label>
            <select id="satisfaction">
                <option value="rat-hai-long">Rất hài lòng</option>
                <option value="hai-long">Hài lòng</option>
                <option value="binh-thuong">Bình thường</option>
                <option value="khong-hai-long">Không hài lòng</option>
            </select>

            <label for="content">Nội dung phản hồi</label>
            <textarea id="content" placeholder="Hãy cho chúng tôi biết cảm nhận của bạn..."></textarea>

            <button type="submit">Gửi feedback</button>
        </form>
    </div>

</body>

</html>
