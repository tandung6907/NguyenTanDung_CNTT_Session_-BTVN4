<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            border: 2px solid #1eff29;
            border-radius: 10px;
            text-align: center;
            padding: 10px;
            width: 300px;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tẩy trăng răng</h1>
        <p>Công nghệ hiện đại - An toàn - Hiệu quả</p>
    </div>

</body>

</html>
