<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        
        body {
            border: 1px solid black;
            text-align: center;
            color: black;
            padding: 5px 0px;
            font-family: 'Times New Roman', Times, serif;
        }

        .banner {
            background-color: #1eff29;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        p {
            font-size: 25px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="banner">
        <h2>NHA KHOA ÁNH DƯƠNG</h2>
    </div>
    <p><abbr title="">Chăm sóc</abbr> nụ cười Việt</p>
</body>

</html>
