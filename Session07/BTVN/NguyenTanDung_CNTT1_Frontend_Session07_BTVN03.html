<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Times New Roman", serif;
        }

        body {
            background: #f5f5f5;
            padding: 40px;
        }

        .dentist-card {
            width: 420px;
            background: #fff;
            border: 1px solid #ccc;
        }

        .card-header {
            border-bottom: 1px solid #ccc;
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .card-header .star {
            font-size: 20px;
            margin-right: 8px;
        }

        .card-header .title {
            color: #ff7a00;
            font-size: 18px;
        }

        .image-box {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
        }

        .card-content {
            padding: 20px;
        }

        .name {
            font-size: 26px;
            margin-bottom: 5px;
            color: #000;
        }

        .specialty {
            font-size: 18px;
            color: #00cc44;
            margin-bottom: 10px;
        }

        .description {
            font-size: 17px;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="dentist-card">
        <div class="card-header">
            <span class="star">⭐</span>
            <span class="title">NHA SĨ NỔI BẬT</span>
        </div>

        <div class="image-box">
            <img src="../PicSs7/MinhTam.jpg" alt="BS. Nguyễn Minh Tâm">
        </div>

        <div class="card-content">
            <h2 class="name">BS. Nguyễn Minh Tâm</h2>
            <p class="specialty">Nha khoa thẩm mỹ</p>
            <p class="description">
                Hơn 10 năm kinh nghiệm trong lĩnh vực nha khoa thẩm mỹ,
                chuyên tẩy trắng răng, dán sứ và phục hình nụ cười.
            </p>
        </div>
    </div>

</body>

</html>
