<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 500px;
            height: 300px;
            border: 1px solid black;
            background-color: green;
            margin: 30px;
            position: absolute;
        }

        .content {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
            border: 1px solid black;
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body>
    <!--
    position: absolute
    1. Tìm phần tử cha gần nhất có thuộc tính position có giá trị khác static sẽ lấy phần tử cha làm mốc.
    2. Không thấy sẽ ăn theo mà hình trì duyệt 
    -->
    <div class="container">
        <div class="content">
            <p>KS25-CNTT1</p>
        </div>
    </div>
</body>
</html>
