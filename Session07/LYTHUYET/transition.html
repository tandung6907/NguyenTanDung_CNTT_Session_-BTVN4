<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        .btn {
            border-radius: 36%;
            border: none;
            background-color: green;
            color: white;
            transition: all 0.5s linear ;
        }

        .btn:hover {
            background-color: red;
            cursor: pointer;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <!--
    transition: chuyển đổi
    1.Tên thuộc tính cần xử lý
    2.Thời gian thực hiện
    3.Timing function: tốc độ hiệu ứng
    4.Delay: độ trễ
    -->
    <button class="btn">Login</button>
</body>
</html>
