<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        h1 {
            color: #1e90ff;
            text-align: center;
        }

        .form {
            text-align: center;
        }

        .boderinput {
            border: 1px solid #1e90ff;
            width: 250px;
            height: 25px;
            padding: 10px;
        }

        .bodertextarea {
            border: 1px solid #1e90ff;
            width: 230px;
            height: 100px;
            padding: 10px;
        }

        .button {
            border: 2px solid black;
            background-color: #00bfff;
            color: white;
            padding: 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>Ý Kiến Phản Hồi tới Nha Sỹ</h1>
    </header>
    <main>
        <form action="" class="form">
            <label for="name">Họ và tên: </label><br>
            <input type="text" name="name" id="name" placeholder="Nhập họ và tên" class="boderinput" required><br>
            <label for="email">Email: </label><br>
            <input type="email" name="email" id="email" placeholder="Nhập email của bạn" class="boderinput"><br>
            <label for="note">Phản hồi của bạn: </label><br>
            <textarea name="note" id="note" class="bodertextarea">Nhập ý kiến của bạn...</textarea><br>
            <button type="submit" class="button">Gửi ý kiến</button>
        </form>
    </main>
</body>

</html>
