<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Văn Phòng Nha Khoa</title>
    <style>
        .banner {
            background-color: #1eff29;
            text-align: center;
            padding: 15px 0;
            /*Khoảng cách bên trong thẻ*/
            font-family: Arial, Helvetica, sans-serif;
        }

        .banner h1 {
            margin: 0;
            /*Khoảng cách bên ngoài thẻ*/
            font-size: 40px;
            font-weight: bold;
            color: black;
        }

        .banner p {
            margin: 5px 0 0;
            font-size: 18px;
            font-style: italic;
            color: black;
        }
    </style>
</head>

<body>

    <header>
        <div class="banner">
            <h1>Văn Phòng Nha Khoa</h1>
            <p>Chăm sóc răng miệng - Mang lại nụ cười tươi sáng</p>
        </div>
    </header>


</body>

</html>
