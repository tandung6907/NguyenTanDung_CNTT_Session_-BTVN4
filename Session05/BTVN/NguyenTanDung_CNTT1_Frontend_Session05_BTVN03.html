<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }

        .service-box {
            width: 80%;
            margin: 30px auto;
            background-color: #f4f4f9;
            padding: 25px;
        }

        .service-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .service-title h2 {
            margin: 0;
            color: #1e90ff;
            font-size: 26px;
        }

        .service-title p {
            margin: 5px 0 0;
            font-size: 15px;
        }

        .service-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .service-list li {
            margin: 10px 0;
            font-size: 16px;
        }

        .service-list li:first-child {
            text-decoration: underline line-through;
        }

        .service-list li:nth-child(4) {
            letter-spacing: 5px;
        }

        .service-list li:nth-child(3) {
            padding: 10px 0 15px 0;
        }
    </style>
</head>

<body>

    <div class="service-box">
        <div class="service-title">
            <h2>Dịch Vụ</h2>
            <p>Khám và tư vấn răng miệng tổng quát</p>
        </div>

        <ul class="service-list">
            <li>Trồng răng Implant</li>
            <li><strong>Niềng răng thẩm mỹ</strong></li>
            <li>Tẩy trắng răng</li>
            <li>Điều trị viêm lợi, chảy máu chân răng</li>
        </ul>
    </div>

</body>

</html>
