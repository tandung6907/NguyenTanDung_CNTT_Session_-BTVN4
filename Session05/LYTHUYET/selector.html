<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        .p {
            color: green;
        }

        #a {
            color: aquamarine
        }

        .b {
            background-color: greenyellow;
            border: none;
            color: red;
        }
        .c{
            background-color: black;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Bộ chọn CSS
     1.Class: trong 1 element có thể dùng nhiều class
              ĐẶT TÊN: 
              1.Đừng đặt tiếng việt
              2.Đặt đúng ngữ nghĩa
              3.Theo tính quy chuẩn BEM (Block Element Modifier)
     2.Id: định dạng duy nhất 1 element giống như CCCD
     Thứ tiện độ ưu tiên trong selector:
     (bé đến lớn) element -> class -> id -> important
                  1          10       100   1000
     -->
    <div class="c">
        <p class="p">阮丹勇</p>
        <p id="a">英俊、温柔、善良</p>
        <p id="a">英俊、温柔、善良</p>
        <button class="b">登录</button>
        <button class="b">登记</button>
</body>
</div>

</html>
