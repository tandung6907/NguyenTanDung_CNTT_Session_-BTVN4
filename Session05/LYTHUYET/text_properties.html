<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        p{
            text-align: justify;
        }
        .lorem {
            color: rgba(7, 67, 121, 0.5);
            text-decoration: underline dotted;
        }
    </style>
</head>
<body>
    <!-- Bộ chọn thuộc tính text
            1.text-align: căn vị trí văn bản
            2.color: màu chữ
                các giá trị mã màu:
                    + theo tên tiếng anh: red, blue, yellow
                    + mã màu hecxa: #000000
                    + rgb (red_green_blue): 
                    + rgba (red_green_blue_alpha): alpha là độ trong suốt (0-1)
            3.text-decoration: trang trí văn bản
            4.letter-spacing: khoảng cách giữa các chữ cái
              word-spacing: khoảng cách giữa các từ
            5.text-transform gồm các giá trị
                +lowercase: chuyển text thành viết thường hết
                +uppercase: chuyển text thành văn bản hết
                +capitalize: viết hoa chữ cái đầu tiên
            6.text-shadow: đổ bóng
    
    -->
    <p>1.text-align</p>
    <p class="lorem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nisi ut ipsa dolores maxime blanditiis nostrum illo necessitatibus nihil a, consectetur voluptate sint cupiditate corporis officiis, tenetur aliquid inventore! Maxime, itaque?</p>
</body>
</html>
