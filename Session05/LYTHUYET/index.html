<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .d{
            background-color: cadetblue;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 40px;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- CSS (Cascading Style Sheet): dùng để tạo kiểu, định dạng bố cục cho trang web
         I - Các cách nhúng CSS vào trong HTML
            Có 3 cách: 
            1.Inline: Viết trực tiếp trong thẻ (element)
            2.Internal: viết CSS trong trong cặp thẻ style được đặt cuối cùng trong thẻ head
            3.External: tạo file CSS riêng rồi link vào HTML
            Thứ tự ưu tiên: 
            - cái nào code sau cái ý chạy trước
    -->
            <div class="d">
                <h1 style="color: aquamarine;">阮丹勇</h1>
                <h2>英俊、温柔、善良</h2>
            </div>
            

</body>
</html>
