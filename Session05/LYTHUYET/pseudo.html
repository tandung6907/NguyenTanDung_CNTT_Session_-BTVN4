<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <style>
        a{
            text-decoration: none;
        }
        a:hover{
            color: red;
        }
        a:active{
            color: green;
        }
        /* a:visited{
            color: black;
        } */
    </style>
</head>
<body>
    <!--
    Pseudo:
    1.hover: đổi màu khi đưa chuột vào
    2.active: đổi màu khi bấm vào
    3.visited: đổi màu khi đã bấm vào
    -->
    <a href="">home</a>
    <a href="">describe</a>
    <a href="">contact</a>
</body>
</html>
