<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
</head>
<body>
    <table style="text-align: center;" border="2" cellpadding="10" cellspacing="10" > 
        <!-- cellpadding là khoảng cách từ nội dung đến đường viền của bảng -->
        <!-- cellspacing là khoảng cách từ ô đến đường viền của bảng -->
        <!-- align dùng để căn  -->
        <!-- bgcolor chỉnh màu ô nội dung -->
        <caption>Quản lý sinh viên</caption>
        <!-- caption là tiêu đề của bảng đặt đầu hay cuối đều được -->
        <thead>
            <!-- phần đầu bảng -->
            <tr>
                <!-- hàng của bảng -->
                 <th>STT</th>
                 <th>Họ và tên</th>
             </tr>
        </thead>
        <tbody>
            <!-- phần thân bảng -->
             <tr>
                <td>1</td>
                <td style="background-color:darkgreen;">Nguyễn Tấn Dũng</td>
             </tr>
             <tr>
                <td>2</td>
                <td style="background-color:aquamarine;">Nguyễn Tấn Dũng 2</td>
             </tr>
        </tbody>
        <tfoot>
            <!-- phần cuối bảng -->
             <tr>
                <td colspan="2">Tổng số sinh viên: 2</td>
                <!-- colspan dùng để gộp các cột lại với nhau -->
                 <!-- rowspan dùng để gộp các hàng vào với nhau -->
             </tr>
        </tfoot>
    </table>
</body>
</html>
