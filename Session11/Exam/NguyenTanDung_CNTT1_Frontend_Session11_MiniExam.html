<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../CSS11/MiniExam.css">

<body>
    <header class="header">
        <div class="container">
            <h2>Phở Nhà</h2>
            <nav>

            </nav>
        </div>
    </header>
    <main class="main">
        <div class="about-content">
            <h2>Phở Ngon - Chuẩn Vị Hà Nội</h2> <br>
            <p>
                Nước hầm từ xương bò tươi trong 10 tiếng <br>

                </div>
                <div class="list-img">
                    <img src="../PicSs11/Phở đặc biệt.png" alt="Phở Đặc Biệt">
