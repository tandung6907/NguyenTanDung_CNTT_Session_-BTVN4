<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <link rel="stylesheet" href="../CSS10/BTVN03.css">
</head>
<body>
    <div class="container">
        <h1>Món Nổi Bật Hôm Nay</h1>

        <!-- First Row: 60% Big + 40% Small (2 dishes of 20% each) -->
        <div class="first-row">
            <!-- Big Dish - 60% -->
            <div class="big-dish">
                <div class="dish-card">
                    <div class="dish-image">
                        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=800&q=80" alt="Grilled Wagyu Beef Tenderloin">
                    </div>
                    <div class="dish-info">
                        <h3 class="dish-name">Grilled Wagyu Beef Tenderloin</h3>
                        <p class="dish-price">1,200,000 ₫</p>
                    </div>
                </div>
            </div>

            <!-- Small Dishes Container - 40% total (each dish 20% of row) -->
            <div class="small-dishes-container">
                <div class="small-dish">
                    <div class="dish-card">
                        <div class="dish-image">
                            <img src="https://images.unsplash.com/photo-1559511260-66a654ae982a?w=600&q=80" alt="Seared Scallops">
                        </div>
                        <div class="dish-info">
                            <h3 class="dish-name">Seared Scallops</h3>
                            <p class="dish-price">520,000 ₫</p>
                        </div>
                    </div>
                </div>

                <div class="small-dish">
                    <div class="dish-card">
                        <div class="dish-image">
                            <img src="https://media.istockphoto.com/id/134715042/fr/photo/caille-oeuf-mimosa.webp?a=1&b=1&s=612x612&w=0&k=20&c=r0Pi3J5JPHEQYms2nT4QS_afslRdBHoqk6oeGowVvE4=" alt="Truffle Deviled Eggs">
                        </div>
                        <div class="dish-info">
                            <h3 class="dish-name">Truffle Deviled Eggs</h3>
                            <p class="dish-price">180,000 ₫</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Second Row: Two equal dishes -->
        <div class="second-row">
            <div class="dish-card-wrapper">
                <div class="dish-card">
                    <div class="dish-image">
                        <img src="https://images.unsplash.com/photo-1547592166-23ac45744acd?w=600&q=80" alt="Lobster Bisque">
                    </div>
                    <div class="dish-info">
                        <h3 class="dish-name">Lobster Bisque</h3>
                        <p class="dish-price">420,000 ₫</p>
                    </div>
                </div>
            </div>

            <div class="dish-card-wrapper">
                <div class="dish-card">
                    <div class="dish-image">
                        <img src="https://images.unsplash.com/photo-1625944525533-473f1a3d54e7?w=600&q=80" alt="Pan-Seared Foie Gras">
                    </div>
                    <div class="dish-info">
                        <h3 class="dish-name">Pan-Seared Foie Gras</h3>
                        <p class="dish-price">580,000 ₫</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
