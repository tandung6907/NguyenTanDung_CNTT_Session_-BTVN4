<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
</head>
<body>
    <form>
        <label for="name">Họ và tên: </label>
        <input type="text" name="name" id="name" required><br>
        <label for="birth">Ngày sinh: </label>
        <input type="date" name="birth" id="birth" required><br>
        <label for="gender">Giới tính: </label>
        Nam
        <input type="radio" name="gender" required>
        Nữ
        <input type="radio" name="gender" required><br>
        <label for="phone">Số điện thoại: </label>
        <input type="tel" name="phone" id="phone" required><br>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" required><br>
        <label for="address">Địa chỉ: </label>
        <textarea name="address" id="address" required></textarea><br>
        Vai trò trong nhóm: 
        <select name="">
            <option value="">Thành viên</option>
            <option value="">Tp1</option>
            <option value="">Tp2</option>
            <option value="">Tp3</option>
            <option value="">Tp4</option>
            <option value="">Tp5</option>
            <option value="">Tp6</option>
        </select><br>
        <label for="favourite">Sở thích: </label>
        <input type="text" name="favourite" id="favourite" required><br>
        <label for="skill">Kỹ năng: </label>
        <textarea name="skill" id="skill" required></textarea><br>
        Thời gian rảnh: 
        <input type="checkbox" name="sang" value="sang">
        Sáng
        <input type="checkbox" name="trua" value="trua">
        Trưa
        <input type="checkbox" name="toi" value="toi">
        Tối
        <br>
        <label for="reason">Lý do tham gia nhóm: </label>
        <textarea name="reason" id="reason" required></textarea><br>
        <label for="favouritecolor">Màu yêu thích: </label>
        <input type="color" name="favouritecolor" id="favouritecolor" style="color: black;"><br>
        Đăng ký nhận bản tin: 
        <input type="checkbox" name="dangky" value="dangky">
        có <br>
        <label for="notification">Thông báo: </label>
        <input type="radio" name="gender" required>
        Email
        <input type="radio" name="gender" required>
        SMS <br>
        <button type="submit">Đăng ký thành viên</button>
    </form>
</body>
</html>
