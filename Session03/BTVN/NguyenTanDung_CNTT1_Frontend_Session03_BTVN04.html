<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="device-width, initial-scale=1.0">
        <title>Trang Web của TanDung</title>
    </head>
    <body>
        <form>
            Chọn sản phẩm:
            <select name="">
                <option value="">Sản phẩm 1</option>
                <option value="">Sản phẩm 2</option>
                <option value="">Sản phẩm 3</option>
                <option value="">Sản phẩm 4</option>
                <option value="">Sản phẩm 5</option>
                <option value="">Sản phẩm 6</option>
            </select> <br>
            <label for="count">Số lượng: </label>
            <input type="number" name="count" id="count" min="1"/> <br>
            <label for="address">Địa chỉ giao hàng: </label>
            <textarea name="address" id="address" required></textarea> <br>
            <button type="submit">Đặt hàng</button>
        </form>
    </body>
</html>
