<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="device-width, initial-scale=1.0">
        <title>Trang Web của TanDung</title>
    </head>
    <body>
        <form>
            <label for="name">Họ và tên: </label>
            <input type="text" name="name" id="name" required/> <br>
            <label for="time">Nhập ngày giờ: </label>
            <input type="datetime-local" name="time" id="time"> <br>
            Loại dịch vụ:
            <select name="">
                <option value="">Tư vấn 1</option>
                <option value="">Tư vấn 2</option>
                <option value="">Tư vấn 3</option>
                <option value="">Tư vấn 4</option>
            </select> <br>
            <label for="note">Ghi chú: </label>
            <textarea name="note" id="note"></textarea> <br>
            <button type="submit">Đặt lịch</button>
        </form>
    </body>
</html>
