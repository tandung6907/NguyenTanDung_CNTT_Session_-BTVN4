<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLearn - Nền tảng học tập</title>
    <link rel="stylesheet" href="../CSS12/BTVN02.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="main-wrapper">
        <header class="header-logo">
            <div class="logo">
                <i class="fas fa-book-open"></i> EduLearn
            </div>
        </header>

        <section class="course-section">
            <div class="course-card">
                <div class="course-banner">
                    <span class="tag-top">Bán chạy</span>
                    <div class="course-icon"><i class="fas fa-code"></i></div>
                </div>
                <div class="course-body">
                    <div class="course-meta-top">
                        <span class="category-tag">Lập trình</span>
                        <span class="rating"><i class="fas fa-star"></i> 4.9</span>
                    </div>
                    <h2>Lập trình Web Full Stack</h2>
                    <p>Học lập trình web từ cơ bản đến nâng cao với các công nghệ hiện đại nhất</p>
                    <div class="course-info">
                        <span><i class="far fa-clock"></i> 40 giờ</span>
                        <span><i class="fas fa-users"></i> 12K+ học viên</span>
                    </div>
                    <div class="course-footer">
                        <span class="course-price">2.990.000đ</span>
                        <button class="btn-detail">Xem chi tiết</button>
                    </div>
                </div>
            </div>
        </section>


</body>

</html>
