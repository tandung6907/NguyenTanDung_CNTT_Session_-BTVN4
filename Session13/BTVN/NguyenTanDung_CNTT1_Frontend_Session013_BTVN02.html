<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <link rel="stylesheet" href="../CSS13/BTVN02.css">
</head>

<body>
    <div class="container">
        <form action="" class="login-form">
            <h2>Đăng nhập</h2>
            <p class="subtitle">Đăng nhập để sử dụng hệ thống e-learning</p>
            <div class="login-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Nhập địa chỉ email">
            </div>
            <div class="login-group">
                <label for="pass">Mật khẩu</label>
                <input type="password" name="password" id="pass" placeholder="Nhập mật khẩu">
            </div>
            <div class="login-options">
                <label class="remember-login">
                    <input type="checkbox">
                    <span>Ghi nhớ đăng nhập</span>
                </label>

                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">Đăng nhập</button>

            <p class="register-link">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
        </form>
    </div>
</body>

</html>
