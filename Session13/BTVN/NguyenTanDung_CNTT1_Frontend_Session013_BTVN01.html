<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web của TanDung</title>
    <link rel="stylesheet" href="../CSS13/BTVN01.css">
</head>

<body>
    <div class="container">
        <form action="" class="register-form">
            <h2>Đăng ký</h2>
            <p class="subtitle">Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>

            <div class="row">
                <div class="form-group">
                    <label for="name">Họ và tên đệm</label>
                    <input type="text" name="name" id="name" placeholder="Nguyễn Văn">
                </div>
                <div class="form-group">
                    <label for="fullname">Tên đầy đủ</label>
                    <input type="text" name="fullname" id="fullname" placeholder="An">
                </div>
            </div>

            <div class="form-group">
                <label for="tel">Số điện thoại</label>
                <input type="tel" name="tel" id="tel" placeholder="0912 345 678">
            </div>

            <div class="form-group">
                <label for="mail">Email</label>
                <input type="email" name="email" id="mail" placeholder="Nhập địa chỉ email">
            </div>

            <div class="form-group">
                <label for="pass">Mật khẩu</label>
                <input type="password" name="password" id="pass" placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label for="re-enter">Nhập lại mật khẩu</label>
                <input type="password" name="pass" id="re-enter" placeholder="Nhập lại mật khẩu">
            </div>

            <button type="submit" class="btn-submit">Đăng ký</button>

            <p class="login-link">Đã có tài khoản? <a href="#">Đăng nhập</a></p>
        </form>
    </div>
</body>

</html>
